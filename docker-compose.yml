version: '3.8'

services:
  # Service 1: FastAPI Backend
  backend:
    build: .
    container_name: rent_backend
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  # Service 2: Streamlit Frontend
  frontend:
    build: .
    container_name: rent_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000/predict
    command: python -m streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - backend